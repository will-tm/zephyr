description: Generic Bouffalo Labs PLL

compatible: "bflb,pll"

include: [base.yaml, clock-controller.yaml]

properties:
  clocks:
    type: phandle-array
    required: true
    description: PLL reference clock source

  top-frequency:
    type: int
    required: true
    description: Maximum VCO output frequency in Hz

  "#clock-cells":
    const: 1

clock-cells:
  - select
