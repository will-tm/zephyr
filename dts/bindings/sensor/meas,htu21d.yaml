description: |
  TE Connectivity HTU21D digital humidity and temperature sensor.
  Communicates via I2C at fixed address 0x40.

compatible: "meas,htu21d"

include: [sensor-device.yaml, i2c-device.yaml]

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      htu21d@40 {
        compatible = "meas,htu21d";
        reg = <0x40>;
      };
    };
