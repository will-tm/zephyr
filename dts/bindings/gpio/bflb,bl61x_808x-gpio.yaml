description: BouffaloLab GPIO node for BL61X and BL808X series

compatible: "bflb,bl61x_808x-gpio"

include:
  - name: base.yaml
  - name: gpio-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
