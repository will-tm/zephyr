description: |
  Bouffalo Lab camera front end.

  The front end receives the parallel bus of the sensor and feeds it to the
  capture interface, after buffering each line to cross into the capture
  clock domain. It also drives the sensor reference clock (MCLK) from one of
  the chip clock outputs, which is selected through its pinctrl state.

  A compressed (JPEG) stream needs a second pinctrl state, named "compressed",
  that takes the frame sync (VSYNC) pin away from the front end, for instance
  as a plain GPIO input. The stream is then captured as a single endless frame,
  as the capture interface stalls on the frame ends of a compressed stream.

compatible: "bflb,camfront"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true
    description: |
      The capture clock, named "core", and the reference clock driven out to the
      sensor, named "ref".

  clock-names:
    required: true

  mclk-frequency:
    type: int
    default: 24000000
    description: |
      Rate the reference clock is driven out to the sensor at. The clock
      controller composes it from whichever of its sources can produce it.

  pclk-frequency:
    type: int
    default: 24000000
    description: |
      Pixel clock rate the sensor drives on PCLK, for a sensor that does not
      report its pixel rate. Used, together with the capture clock rate, to
      size the amount of pixel data buffered ahead of the capture interface.

  source:
    type: phandle
    required: true
    description: Image sensor feeding the parallel bus.

child-binding:
  child-binding:
    include: video-interfaces.yaml

    properties:
      reg:
        type: array
        required: true
        description: Endpoint 0 is the sensor input, endpoint 1 the capture interface output.
