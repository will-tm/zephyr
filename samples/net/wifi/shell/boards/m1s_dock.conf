# M1S Dock (BL808 M0) WiFi shell configuration -- memory-constrained:
# 136 KB usable RAM after the 88 KB WIFI_RAM carve.

# Minimal log mode: deferred logging's thread is starved by the firmware
# scheduler thread; minimal also saves RAM over immediate-mode buffers.
CONFIG_LOG_MODE_MINIMAL=y

# Drop IPv6/TCP and trim the PSA key-slot table below the driver default.
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4

# Small fixed libc arena for mbedTLS calloc.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=3072

# Driver buffer trims for the 136 KB budget.
CONFIG_BFLB_WIFI_FW_TASK_STACK_SIZE=10240
CONFIG_BFLB_WIFI_RX_RING_CNT=2
CONFIG_BFLB_WIFI_SCAN_AP_MAX=8

# Stack trims below the driver defaults.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_SHELL_STACK_SIZE=4608
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1800
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=4096
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=3072

# Net buffer trims below the driver defaults.
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=5

# Time-slice same-priority preemptible threads: the FW scheduler thread
# re-wakes every millisecond while polling its RX semaphore and would
# otherwise monopolise its priority level during traffic bursts,
# starving net_mgmt / shell_uart.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0

CONFIG_WIFI_LOG_LEVEL_ERR=y
