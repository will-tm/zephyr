# Shell
CONFIG_SHELL=y

# GPIO
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# SPI
CONFIG_SPI=y

# Sensor
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_HTU21D=y
CONFIG_MS5637=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

# Display (e-ink SSD1680)
CONFIG_DISPLAY=y
CONFIG_SSD16XX=y

# External flash
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TE Smart Badge"

# Logging
CONFIG_LOG=y

# Allow runtime re-init of sensors that fail at boot
CONFIG_DEVICE_MUTABLE=y

# Regulator (for display power control)
CONFIG_REGULATOR=y

# Input subsystem (buttons)
CONFIG_INPUT=y
