# Shell
CONFIG_SHELL=y

# GPIO
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# SPI
CONFIG_SPI=y

# Sensor
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_HTU21D=y
CONFIG_MS5637=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

# Display (e-ink SSD1680 + Character Framebuffer)
CONFIG_DISPLAY=y
CONFIG_SSD16XX=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# External flash
CONFIG_FLASH=y
CONFIG_FLASH_SHELL=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# USB - composite device: CDC ACM (shell) + MSC (flash disk)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
# Disable board auto-init — app manages USB composite device
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Disk driver for external flash
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y

# FAT filesystem for USB MSC compatibility
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TE Smart Badge"

# Logging
CONFIG_LOG=y
# Wait for USB CDC before logging
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000

# Allow runtime re-init of sensors that fail at boot
CONFIG_DEVICE_MUTABLE=y

# Regulator (for display power control)
CONFIG_REGULATOR=y

# Input subsystem (buttons)
CONFIG_INPUT=y
