CONFIG_BFLB_BL61X_SDR=y
CONFIG_CRC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# USB: vendor stream interface plus CDC-ACM (burst protocol for Web Serial).
# Seven endpoints need the four data FIFOs shared by both directions.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_BFLB_V2_FIFO_BIDIR=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_JSON_LIBRARY=y

# UART protocol below the USB stream and producer threads
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_MAIN_STACK_SIZE=2048
