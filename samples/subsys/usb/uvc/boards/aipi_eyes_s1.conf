# A VGA frame is 600KB, so the pool lives in PSRAM. It holds three of them,
# which a compressed frame never outgrows
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1846272
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3

# Raw frames are sent straight out of the capture ring, which holds three VGA
# frames so that one is not written again while it is still being sent
CONFIG_VIDEO_BFLB_DVP2AXI_RING_SIZE=1843200

# A single FIFO block cannot keep a high speed bulk stream going
CONFIG_UDC_BFLB_V2_EP1_IN_FIFO_BLOCKS=3

# Keep a shell on the console, to query and drive the camera pipeline
CONFIG_SHELL=y
CONFIG_VIDEO_SHELL=y
