CONFIG_VIDEO=y
CONFIG_VIDEO_SHELL=y
CONFIG_SHELL=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_SHELL=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y

# Room for a stream of large frames in flight
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=44
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=24576
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192

CONFIG_MAIN_STACK_SIZE=2048

# The WiFi firmware allocates its messages from the libc heap, which otherwise
# only gets the RAM left over
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
# The WiFi connect request runs deep into the supplicant
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4608
CONFIG_LOG=y

# Three capture buffers and the snapshot hold a 1600x1200 JPEG each, the latest
# frame and the frame of each stream a VGA JPEG
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2097152
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=7

# JPEG is captured into the ring as a byte stream, a couple of frames is enough
CONFIG_VIDEO_BFLB_DVP2AXI_RING_SIZE=1048576

# Sixteen full size frames in flight to the WiFi firmware
CONFIG_WIFI_BFLB_WIFI6_TX_MAX_PENDING=16
CONFIG_WIFI_BFLB_WIFI6_WRAM_HEAP_SIZE=32768
CONFIG_NET_STATISTICS=y

# Catch stack overflows and report stack usage
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
