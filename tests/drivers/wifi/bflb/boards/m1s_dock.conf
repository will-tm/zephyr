# M1S Dock (BL808 M0): 136 KB usable RAM after the WIFI_RAM carve.
# Same memory-constrained trims as the other bflb WiFi boards.
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_BFLB_WIFI_FW_TASK_STACK_SIZE=12288
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=4096
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=3200
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=9
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_BFLB_WIFI_RX_RING_CNT=3
CONFIG_BFLB_WIFI_SCAN_AP_MAX=10
